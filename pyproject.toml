[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "globus-migratability"
version = "0.1.0"
description = "Compares globus-sdk client models against published Globus service OpenAPI specifications"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "globus-sdk>=4.0",
    "requests>=2.28",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
]

[project.scripts]
globus-migratability = "globus_migratability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
globus_migratability = ["templates/*.jinja"]
